name: Checks and unsigned apps (macOS and Windows)

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the `release` job (version tags) gets write access.
permissions:
  contents: read

concurrency:
  group: daybar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release tag, versions and signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z (got '$TAG')."
            exit 1
          fi
          if [[ "$HAS_SIGNING_KEY" != 'true' ]]; then
            echo '::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is missing. Add it (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) under Settings > Secrets and variables > Actions; see docs/RELEASE.md.'
            exit 1
          fi
          node - <<'EOF'
          const fs = require('node:fs');
          const want = process.env.TAG.slice(1);
          const read = (f) => fs.readFileSync(f, 'utf8');
          const cargo = /^\[package\][^[]*?^version\s*=\s*"([^"]+)"/ms.exec(
            read('apps/desktop/src-tauri/Cargo.toml'),
          );
          const found = {
            'apps/desktop/src-tauri/tauri.conf.json': JSON.parse(read('apps/desktop/src-tauri/tauri.conf.json')).version,
            'apps/desktop/src-tauri/Cargo.toml': cargo && cargo[1],
            'apps/desktop/package.json': JSON.parse(read('apps/desktop/package.json')).version,
          };
          let bad = false;
          for (const [file, v] of Object.entries(found)) {
            if (v !== want) {
              console.log(`::error file=${file}::Tag ${process.env.TAG} expects version ${want} but ${file} has ${v}.`);
              bad = true;
            }
          }
          if (bad) process.exit(1);
          console.log(`Tag ${process.env.TAG} matches all three versions.`);
          EOF
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Seed synthetic sandbox only
        run: pnpm seed
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test in Toronto and London
        run: pnpm test:tz
      - name: Test standalone phone scripts
        shell: bash
        run: |
          shopt -s nullglob
          tests=(scriptable/tests/*.test.mjs)
          if ((${#tests[@]} == 0)); then
            echo '::error::No phone script tests found.'
            exit 1
          fi
          node --test "${tests[@]}"
      - name: Rust tests (temporary folders only)
        run: >-
          cargo test --locked
          --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build static export
        run: pnpm build
      # Version tags only from here. The updater signing key is exposed to the
      # build step alone. Do not pass --no-sign here: it also skips updater
      # signing, so no .sig would be produced. The app is ad-hoc signed through
      # signingIdentity "-" in tauri.conf.json (no Apple certificate, no
      # notarization); the Tauri updater signature is separate and is what the
      # installed app verifies.
      - name: Package app and DMG, sign updater artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles app,dmg
      - name: Stage Mac release files
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # The latest.json entry below is keyed darwin-aarch64, so refuse any other runner arch.
          if [[ "$(uname -m)" != 'arm64' ]]; then
            echo "::error::Runner is $(uname -m); latest.json is only generated for darwin-aarch64."
            exit 1
          fi
          version="${TAG#v}"
          bundle=apps/desktop/src-tauri/target/release/bundle
          out=release-assets
          mkdir "$out"
          dmg="Daybar_${version}_aarch64.dmg"
          zip="Daybar_${version}_aarch64.app.zip"
          updater="Daybar_${version}_aarch64.app.tar.gz"
          for f in "$bundle/dmg/$dmg" "$bundle/macos/Daybar.app.tar.gz" "$bundle/macos/Daybar.app.tar.gz.sig"; do
            if [[ ! -s "$f" ]]; then
              echo "::error::Expected build output is missing or empty: $f"
              ls -R "$bundle"
              exit 1
            fi
          done
          cp "$bundle/dmg/$dmg" "$out/$dmg"
          cp "$bundle/macos/Daybar.app.tar.gz" "$out/$updater"
          cp "$bundle/macos/Daybar.app.tar.gz.sig" "$out/$updater.sig"
          ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/Daybar.app" "$out/$zip"
          # This platform's entry for latest.json; the release job merges it with the Windows one.
          VERSION="$version" ASSET="$updater" DIR="$out" node - <<'EOF'
          const fs = require('node:fs');
          const { ASSET, DIR, TAG, REPO } = process.env;
          const entry = {
            signature: fs.readFileSync(`${DIR}/${ASSET}.sig`, 'utf8').trim(),
            url: `https://github.com/${REPO}/releases/download/${TAG}/${ASSET}`,
          };
          fs.writeFileSync(`${DIR}/darwin-aarch64.platform.json`, JSON.stringify(entry) + '\n');
          EOF
          ls -l "$out"
      - name: Upload release files for the release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Daybar-macos-${{ github.ref_name }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  # The same checks for the Windows build (DECISIONS 018), and on version tags the NSIS
  # installer. Lint, typecheck and the JavaScript tests run once, on the Mac job: they do
  # not depend on the operating system. The Rust tests do, so they run here too.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Keep LF line endings so fixtures and generated files match the Mac checkout byte for byte.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Seed synthetic sandbox only
        run: pnpm seed
      - name: Rust tests on Windows (temporary folders only)
        run: >-
          cargo test --locked
          --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build static export
        run: pnpm build
      # Version tags only from here. The installer is not Authenticode-signed (no
      # certificate), so SmartScreen warns on first run; the Tauri updater signature
      # is separate and is what the installed app verifies before updating.
      - name: Package the Windows installer, sign updater artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis
      - name: Stage Windows release files
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          bundle=apps/desktop/src-tauri/target/release/bundle
          out=release-assets
          mkdir "$out"
          setup="Daybar_${version}_x64-setup.exe"
          for f in "$bundle/nsis/$setup" "$bundle/nsis/$setup.sig"; do
            if [[ ! -s "$f" ]]; then
              echo "::error::Expected build output is missing or empty: $f"
              ls -R "$bundle"
              exit 1
            fi
          done
          # The NSIS installer is both the download and the in-app update.
          cp "$bundle/nsis/$setup" "$out/$setup"
          cp "$bundle/nsis/$setup.sig" "$out/$setup.sig"
          ASSET="$setup" DIR="$out" node - <<'EOF'
          const fs = require('node:fs');
          const { ASSET, DIR, TAG, REPO } = process.env;
          const entry = {
            signature: fs.readFileSync(`${DIR}/${ASSET}.sig`, 'utf8').trim(),
            url: `https://github.com/${REPO}/releases/download/${TAG}/${ASSET}`,
          };
          fs.writeFileSync(`${DIR}/windows-x86_64.platform.json`, JSON.stringify(entry) + '\n');
          EOF
          ls -l "$out"
      - name: Upload release files for the release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Daybar-windows-${{ github.ref_name }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  # Creates a DRAFT release: nothing is public until you publish it by hand.
  # Needs no checkout and builds nothing; it only merges and uploads what the Mac
  # and Windows jobs produced.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Daybar-*-${{ github.ref_name }}
          path: release-assets
          merge-multiple: true
      - name: Generate latest.json and checksums
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          node - <<'EOF'
          const fs = require('node:fs');
          const { TAG, REPO } = process.env;
          const version = TAG.slice(1);
          const platforms = {};
          for (const key of ['darwin-aarch64', 'windows-x86_64']) {
            const file = `${key}.platform.json`;
            if (!fs.existsSync(file)) {
              console.log(`::error::Missing ${file}; both the Mac and the Windows build must finish.`);
              process.exit(1);
            }
            platforms[key] = JSON.parse(fs.readFileSync(file, 'utf8'));
            fs.unlinkSync(file);
          }
          const latest = {
            version,
            notes: `Daybar ${version}. Full release notes: https://github.com/${REPO}/releases/tag/${TAG}`,
            pub_date: new Date().toISOString(),
            platforms,
          };
          fs.writeFileSync('latest.json', JSON.stringify(latest, null, 2) + '\n');
          EOF
          cat latest.json
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::A release for $TAG already exists; delete it first or use a new tag."
            exit 1
          fi
          # `gh release view` may not see drafts, so also look for one in the list.
          existing="$(gh release list --repo "$REPO" --limit 100 --json tagName,isDraft \
            --jq "[.[] | select(.tagName == \"$TAG\")] | length")"
          if [[ "$existing" != '0' ]]; then
            echo "::error::A release or draft for $TAG already exists. Delete the old draft under Releases, then re-run this job."
            exit 1
          fi
          gh release create "$TAG" release-assets/* \
            --repo "$REPO" \
            --verify-tag \
            --draft \
            --title "Daybar ${TAG#v}" \
            --generate-notes
          gh release view "$TAG" --repo "$REPO" --json isDraft,isPrerelease,assets \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease)", (.assets[] | "  \(.name) \(.size)")'
          state="$(gh release view "$TAG" --repo "$REPO" --json isDraft,isPrerelease \
            --jq '.isDraft and (.isPrerelease | not)')"
          if [[ "$state" != 'true' ]]; then
            echo '::error::Release must be a draft and not a prerelease.'
            exit 1
          fi
