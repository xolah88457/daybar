<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a212b"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4be066"/>
      <stop offset="1" stop-color="#2fbf48"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px body centred on a 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  <g fill="url(#green)">
    <rect x="243" y="243" width="150" height="150" rx="26"/>
    <rect x="437" y="243" width="150" height="150" rx="26"/>
    <rect x="243" y="437" width="150" height="150" rx="26"/>
    <rect x="437" y="437" width="150" height="150" rx="26"/>
    <rect x="243" y="631" width="150" height="150" rx="26"/>
  </g>
  <rect x="437" y="631" width="150" height="150" rx="26" fill="#ffffff"/>
  <g fill="#ffffff" fill-opacity="0.12">
    <rect x="631" y="243" width="150" height="150" rx="26"/>
    <rect x="631" y="437" width="150" height="150" rx="26"/>
    <rect x="631" y="631" width="150" height="150" rx="26"/>
  </g>
</svg>
