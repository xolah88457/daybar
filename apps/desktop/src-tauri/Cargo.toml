[package]
name = "daybar"
version = "0.3.4"
edition = "2021"

[lib]
name = "daybar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
notify = "8"
libc = "0.2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Google Calendar (features/google.rs). All already in the tree via the updater.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
ring = "0.17"
url = "2"
base64 = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Default features pull in MapKit, CoreLocation and AppKit bindings; only these are used (radar_mac.rs).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSCalendar", "NSDate", "NSError", "NSNotification", "NSObject", "NSOperation", "NSString"] }
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "block2", "EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKReminder", "EKSource", "EKTypes", "EventKitDefines"] }
block2 = "0.6"
security-framework = "3"

[dev-dependencies]
tempfile = "3"
